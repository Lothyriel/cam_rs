<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camera Console</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --ink: #0f172a;
      --muted: #475569;
      --card: #ffffff;
      --line: #dbe4f0;
      --accent: #0ea5a4;
      --accent-ink: #083344;
      --danger: #b91c1c;
      --ok: #14532d;
      --radius: 14px;
      --shadow: 0 10px 28px rgba(2, 6, 23, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, #dff6ff 0%, transparent 36%),
        radial-gradient(circle at 88% 90%, #d9fbe8 0%, transparent 34%),
        var(--bg);
      min-height: 100vh;
      padding: 20px;
    }

    .shell {
      max-width: 1500px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fcfdff 0%, #f8fbff 100%);
    }

    .card-head h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    .chip {
      border: 1px solid #bce7e7;
      color: var(--accent-ink);
      background: #ecfeff;
      border-radius: 999px;
      font-size: 0.75rem;
      padding: 4px 10px;
      font-weight: 600;
    }

    .card-body {
      padding: 14px 16px;
    }

    .video-wrap {
      width: 100%;
      aspect-ratio: 16 / 6.5;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .select-wrap {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .select-wrap label {
      font-weight: 600;
      font-size: 0.86rem;
      color: #1e293b;
    }

    select,
    button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #c9d6e5;
      background: #ffffff;
      color: var(--ink);
      transition: border-color 120ms ease, transform 80ms ease;
    }

    select {
      width: 100%;
      padding: 9px 11px;
    }

    button {
      min-height: 52px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover:not(:disabled) {
      border-color: #7dd3d3;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, minmax(64px, 1fr));
      gap: 8px;
      max-width: 320px;
      margin-bottom: 12px;
    }

    .dpad .ghost {
      visibility: hidden;
      pointer-events: none;
      border-color: transparent;
      background: transparent;
    }

    .home {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      background: #f8fafc;
    }

    .lists {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }

    .ai-panel {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f8fbff;
    }

    .ai-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
      background: #e2e8f0;
    }

    .ai-banner.active {
      color: var(--accent-ink);
      background: #ccfbf1;
    }

    .ai-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      font-size: 0.84rem;
    }

    .ai-grid strong {
      display: block;
      margin-bottom: 3px;
      color: #334155;
    }

    .ai-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border: 1px solid #d8e4f2;
      border-radius: 12px;
      background: #fff;
    }

    .ai-toggle-copy {
      display: grid;
      gap: 2px;
    }

    .ai-toggle-copy strong {
      font-size: 0.88rem;
      color: #1e293b;
    }

    .ai-toggle-copy span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .ai-toggle-btn {
      min-height: 42px;
      min-width: 124px;
      padding: 0 14px;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
    }

    .ai-toggle-btn.on {
      border-color: #8ee0d3;
      background: #ccfbf1;
      color: #115e59;
    }

    .ai-toggle-btn.off {
      border-color: #fecaca;
      background: #fff1f2;
      color: #991b1b;
    }

    .ai-joystick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border-radius: 10px;
      border: 1px dashed #b6c5d6;
      background: #fff;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1rem;
      font-weight: 700;
    }

    .list-block h3 {
      margin: 0 0 6px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #334155;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.83rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      max-height: 170px;
      overflow: auto;
      background: #fbfdff;
    }

    li {
      padding: 8px 10px;
      border-top: 1px solid #e9eff7;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    li:first-child {
      border-top: 0;
    }

    #status {
      margin-top: 12px;
      min-height: 1.2em;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.86rem;
      color: var(--ok);
    }

    #status.error {
      color: var(--danger);
    }

    @media (max-width: 920px) {
      body {
        padding: 12px;
      }

      .shell {
        gap: 12px;
      }

      .card-head,
      .card-body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .video-wrap {
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="card">
      <div class="card-head">
        <h2>Live Video</h2>
        <span class="chip">WebRTC</span>
      </div>
      <div class="card-body">
        <div class="video-wrap">
          <iframe id="webrtc-frame" allow="autoplay; fullscreen; picture-in-picture"></iframe>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>PTZ Control</h2>
        <span class="chip">ONVIF</span>
      </div>
      <div class="card-body">
        <div class="select-wrap">
          <label for="profile-select">Profile</label>
          <select id="profile-select"></select>
        </div>

        <div class="dpad" id="ptz-controls">
          <button class="ghost" aria-hidden="true" tabindex="-1"></button>
          <button data-x="0" data-y="0.45" aria-label="Move up">↑</button>
          <button class="ghost" aria-hidden="true" tabindex="-1"></button>

          <button data-x="-0.45" data-y="0" aria-label="Move left">←</button>
          <button class="home" data-preset="1" disabled aria-label="Go home">Home</button>
          <button data-x="0.45" data-y="0" aria-label="Move right">→</button>

          <button class="ghost" aria-hidden="true" tabindex="-1"></button>
          <button data-x="0" data-y="-0.45" aria-label="Move down">↓</button>
          <button class="ghost" aria-hidden="true" tabindex="-1"></button>
        </div>

        <div class="ai-panel">
          <div class="ai-banner" id="ai-banner">Manual PTZ</div>
          <div class="ai-toolbar">
            <div class="ai-toggle-copy">
              <strong>AI Control</strong>
              <span id="ai-toggle-help">Auto-tracking follows motion events.</span>
            </div>
            <button type="button" class="ai-toggle-btn" id="ai-toggle-btn">Loading…</button>
          </div>
          <div class="ai-grid">
            <div>
              <strong>Tracking</strong>
              <span id="ai-tracking">Idle</span>
            </div>
            <div>
              <strong>Offset</strong>
              <span id="ai-offset">x 0.00 / y 0.00</span>
            </div>
            <div>
              <strong>Velocity</strong>
              <span id="ai-velocity">x 0.00 / y 0.00</span>
            </div>
            <div>
              <strong>Recording</strong>
              <span id="ai-recording">Idle</span>
            </div>
            <div>
              <strong>Camera Motion</strong>
              <span id="ai-camera-motion">Stable</span>
            </div>
          </div>
          <div class="ai-joystick" id="ai-joystick">·</div>
        </div>

        <div class="lists">
          <div class="list-block">
            <h3>Presets</h3>
            <ul id="presets"></ul>
          </div>
        </div>

        <div id="status"></div>
      </div>
    </section>
  </main>

  <script>
    const WEBRTC_URL = __WEBRTC_URL__;
    const CONFIGURED_PROFILE_TOKEN = __CONFIGURED_PROFILE_TOKEN__;
    const statusEl = document.getElementById('status');
    const presetsEl = document.getElementById('presets');
    const profileSelectEl = document.getElementById('profile-select');
    const goHomeBtn = document.querySelector('button[data-preset]');
    const aiBannerEl = document.getElementById('ai-banner');
    const aiTrackingEl = document.getElementById('ai-tracking');
    const aiOffsetEl = document.getElementById('ai-offset');
    const aiVelocityEl = document.getElementById('ai-velocity');
    const aiRecordingEl = document.getElementById('ai-recording');
    const aiCameraMotionEl = document.getElementById('ai-camera-motion');
    const aiJoystickEl = document.getElementById('ai-joystick');
    const aiToggleBtn = document.getElementById('ai-toggle-btn');
    const aiToggleHelpEl = document.getElementById('ai-toggle-help');
    const manualButtons = [...document.querySelectorAll('#ptz-controls button[data-x]'), goHomeBtn];

    let selectedProfileToken = CONFIGURED_PROFILE_TOKEN || null;
    let selectedPresetToken = null;
    let manualLocked = false;
    let aiEnabled = false;
    let aiConfigured = false;
    let aiTogglePending = false;
    let aiEventSource = null;

    const webrtcFrame = document.getElementById('webrtc-frame');
    webrtcFrame.src = WEBRTC_URL;

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('error', isError);
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body || {})
      });
      const text = await res.text();
      if (!res.ok) throw new Error(text || `HTTP ${res.status}`);
      setStatus(text || 'OK');
    }

    function formatAxis(axis) {
      return `x ${Number(axis?.x || 0).toFixed(2)} / y ${Number(axis?.y || 0).toFixed(2)}`;
    }

    function toArrow(axis) {
      const x = Number(axis?.x || 0);
      const y = Number(axis?.y || 0);
      const horizontal = x > 0.12 ? '→' : x < -0.12 ? '←' : '';
      const vertical = y > 0.12 ? '↓' : y < -0.12 ? '↑' : '';
      return `${vertical}${horizontal}` || '·';
    }

    function syncAiToggleUi() {
      if (!aiConfigured) {
        aiToggleBtn.textContent = 'Unavailable';
        aiToggleBtn.disabled = true;
        aiToggleBtn.classList.remove('on', 'off');
        aiToggleHelpEl.textContent = 'Set RTSP_URL or AI_RTSP_URL to enable AI.';
        return;
      }

      aiToggleBtn.disabled = aiTogglePending;
      aiToggleBtn.textContent = aiTogglePending
        ? 'Saving…'
        : aiEnabled
          ? 'Disable AI'
          : 'Enable AI';
      aiToggleBtn.classList.toggle('on', aiEnabled);
      aiToggleBtn.classList.toggle('off', !aiEnabled);
      aiToggleHelpEl.textContent = aiEnabled
        ? 'AI is armed for motion-triggered tracking.'
        : 'AI is paused. Manual PTZ stays available.';
    }

    async function setAiEnabled(enabled) {
      aiTogglePending = true;
      syncAiToggleUi();
      try {
        const res = await fetch('/api/ai/enabled', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({enabled})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error || data?.last_error || JSON.stringify(data));
        await applyAiState(data);
        setStatus(enabled ? 'AI enabled' : 'AI disabled');
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
      } finally {
        aiTogglePending = false;
        syncAiToggleUi();
      }
    }

    async function applyAiState(data) {
      const enabled = Boolean(data?.enabled);
      const configured = Boolean(data?.configured);
      const available = Boolean(enabled && configured && data?.available);
      const locked = Boolean(data?.manual_locked);
      const cameraMoving = Boolean(data?.camera_moving);

      aiEnabled = enabled;
      aiConfigured = configured;
      syncAiToggleUi();

      aiBannerEl.textContent = locked
        ? cameraMoving
          ? 'Camera moving'
          : 'Auto-tracking active'
        : available
          ? 'Manual PTZ'
          : enabled
            ? configured
              ? 'AI reconnecting'
              : 'AI unconfigured'
            : configured
              ? 'AI disabled'
              : 'AI unconfigured';
      aiBannerEl.classList.toggle('active', locked || enabled);
      aiTrackingEl.textContent = data?.tracking ? 'Following target' : 'Idle';
      aiOffsetEl.textContent = formatAxis(data?.target_offset);
      aiVelocityEl.textContent = formatAxis(data?.ptz_velocity);
      aiRecordingEl.textContent = data?.recording ? 'Saving after event' : 'Idle';
      aiCameraMotionEl.textContent = cameraMoving ? 'Settling' : 'Stable';
      aiJoystickEl.textContent = `${toArrow(data?.target_offset)} / ${toArrow(data?.ptz_velocity)}`;

      manualButtons.forEach((button) => {
        if (button === goHomeBtn) {
          button.disabled = locked || !selectedPresetToken;
        } else {
          button.disabled = locked;
        }
      });
      profileSelectEl.disabled = locked;

      if (locked && !manualLocked && activeMoveButton) {
        activeMoveButton = null;
        try {
          await sendStop();
        } catch (err) {
          setStatus(`Error: ${err.message}`, true);
        }
      }

      if (data?.last_error) {
        setStatus(`AI: ${data.last_error}`, true);
      }

      manualLocked = locked;
    }

    function showAiStreamDisconnected() {
      aiBannerEl.textContent = 'AI unavailable';
      aiBannerEl.classList.remove('active');
      aiTrackingEl.textContent = 'Unknown';
      aiRecordingEl.textContent = 'Unknown';
      aiCameraMotionEl.textContent = 'Unknown';
      aiJoystickEl.textContent = '!';
    }

    function connectAiStateStream() {
      if (aiEventSource) {
        aiEventSource.close();
      }

      aiEventSource = new EventSource('/api/ai/events');
      aiEventSource.addEventListener('state', async (event) => {
        try {
          await applyAiState(JSON.parse(event.data));
        } catch (err) {
          setStatus(`Error: ${err.message}`, true);
        }
      });
      aiEventSource.onerror = () => {
        showAiStreamDisconnected();
      };
    }

    async function loadProfiles() {
      try {
        const res = await fetch('/api/onvif/profiles');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || JSON.stringify(data));

        profileSelectEl.innerHTML = '';
        for (const p of (data.profiles || [])) {
          const opt = document.createElement('option');
          opt.value = p.token;
          opt.textContent = `${p.token} - ${p.name || '(no name)'}`;
          profileSelectEl.appendChild(opt);
        }

        if (selectedProfileToken) profileSelectEl.value = selectedProfileToken;
        if (!profileSelectEl.value && profileSelectEl.options.length) profileSelectEl.selectedIndex = 0;
        selectedProfileToken = profileSelectEl.value || selectedProfileToken || null;
        await loadPresets();
      } catch (err) {
        goHomeBtn.disabled = true;
        setStatus(`Error: ${err.message}`, true);
      }
    }

    async function loadPresets() {
      try {
        selectedPresetToken = null;
        goHomeBtn.disabled = true;
        presetsEl.innerHTML = '';
        if (!selectedProfileToken) return;

        const res = await fetch(`/api/onvif/presets?profile_token=${encodeURIComponent(selectedProfileToken)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || JSON.stringify(data));

        const presets = data.presets || [];
        for (const p of presets) {
          const li = document.createElement('li');
          li.textContent = `${p.token} - ${p.name || '(no name)'}`;
          presetsEl.appendChild(li);
        }

        const homeByName = presets.find(p => (p.name || '').toLowerCase() === 'home');
        selectedPresetToken = (homeByName || presets[0] || {}).token || null;
        goHomeBtn.disabled = manualLocked || !selectedPresetToken;
      } catch (err) {
        presetsEl.innerHTML = `<li>Error: ${err.message}</li>`;
        goHomeBtn.disabled = true;
        setStatus(`Error: ${err.message}`, true);
      }
    }

    profileSelectEl.addEventListener('change', () => {
      selectedProfileToken = profileSelectEl.value || null;
      loadPresets();
    });

    loadProfiles();
    connectAiStateStream();

    goHomeBtn.addEventListener('click', async () => {
      try {
        if (manualLocked) throw new Error('Manual PTZ is disabled while AI is active or the camera is still settling');
        if (!selectedPresetToken) throw new Error('No preset token available for this profile');
        await postJson('/api/onvif/goto-preset', {
          preset_token: selectedPresetToken,
          profile_token: selectedProfileToken,
        });
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
      }
    });

    aiToggleBtn.addEventListener('click', async () => {
      if (!aiConfigured || aiTogglePending) return;
      await setAiEnabled(!aiEnabled);
    });

    let activeMoveButton = null;
    async function sendStop() {
      await postJson('/api/onvif/stop', { profile_token: selectedProfileToken });
    }

    function bindDirectionalButton(btn) {
      const start = async (event) => {
        if (manualLocked) return;
        if (activeMoveButton === btn) return;
        event.preventDefault();
        activeMoveButton = btn;
        try {
          await postJson('/api/onvif/move', {
            x: Number(btn.dataset.x || 0),
            y: Number(btn.dataset.y || 0),
            zoom: 0,
            profile_token: selectedProfileToken,
          });
        } catch (err) {
          activeMoveButton = null;
          setStatus(`Error: ${err.message}`, true);
        }
      };

      const stop = async (event) => {
        if (activeMoveButton !== btn) return;
        event.preventDefault();
        activeMoveButton = null;
        try {
          await sendStop();
        } catch (err) {
          setStatus(`Error: ${err.message}`, true);
        }
      };

      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointercancel', stop);
      btn.addEventListener('lostpointercapture', stop);
      btn.addEventListener('pointerleave', (event) => {
        if (event.buttons === 1) stop(event);
      });
      btn.addEventListener('contextmenu', (event) => event.preventDefault());
    }

    document.querySelectorAll('#ptz-controls button[data-x]').forEach(bindDirectionalButton);
    window.addEventListener('pointerup', async () => {
      if (!activeMoveButton) return;
      activeMoveButton = null;
      try {
        await sendStop();
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
      }
    });
    window.addEventListener('beforeunload', () => {
      aiEventSource?.close();
    });
  </script>
</body>

</html>
